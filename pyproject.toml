[project]
name = "timesfm-mcp"
version = "0.1.5"
description = "MCP server for Google's TimesFM 2.5 foundation model — give any AI agent zero-config time-series forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Preetam Ramdhave" }]
keywords = ["mcp", "forecasting", "time-series", "timesfm", "google", "agent", "claude", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "fastmcp>=3.0",
    "numpy>=1.24",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/ramdhavepreetam/timesfm-mcp"
Repository = "https://github.com/ramdhavepreetam/timesfm-mcp"
Issues = "https://github.com/ramdhavepreetam/timesfm-mcp/issues"
Changelog = "https://github.com/ramdhavepreetam/timesfm-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ramdhavepreetam/timesfm-mcp/tree/main/docs"

[project.optional-dependencies]
# Enables the TimesFM 2.5 neural backend. TimesFM 2.5 source is bundled inside
# this package (Apache-2.0, Google LLC) — no separate git clone needed.
# Tracked for removal once Google publishes 2.5 to PyPI:
# https://github.com/google-research/timesfm/issues/432
timesfm = [
    "torch>=2.0.0",
    "huggingface_hub[cli]>=0.23.0",
    "safetensors>=0.5.3",
]
# Optional local-LLM narrative mode (talks to a running Ollama instance via HTTP).
ollama = ["httpx>=0.27"]
# Documentation site (MkDocs Material).
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = ["pytest>=8"]

[project.scripts]
timesfm-mcp = "timesfm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timesfm_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/clean-venv",
    "/timesfm-master",
    "/timesfm.zip",
    "/.pytest_cache",
    "**/__pycache__",
    "**/*.pyc",
    "/.DS_Store",
    "/timesfm-mcp.zip",
    "/docs/adr",
]
