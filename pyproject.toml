[project]
name = "forecast-mcp"
version = "0.1.2"
description = "An MCP server that gives any AI agent time-series forecasting superpowers (TimesFM 2.5 + statistical baselines)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Preetam Ramdhave" }]
keywords = ["mcp", "forecasting", "time-series", "timesfm", "agent", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastmcp>=3.0",
    "numpy>=1.24",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/ramdhavepreetam/forecast-mcp"
Repository = "https://github.com/ramdhavepreetam/forecast-mcp"
Issues = "https://github.com/ramdhavepreetam/forecast-mcp/issues"
Changelog = "https://github.com/ramdhavepreetam/forecast-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ramdhavepreetam/forecast-mcp/tree/main/docs"

[project.optional-dependencies]
# The heavy ML backend. Kept optional so the server runs instantly without it.
timesfm = ["timesfm>=2.5"]
# Optional local-LLM narrative mode (talks to a running Ollama instance via HTTP).
ollama = ["httpx>=0.27"]
# Documentation site (MkDocs Material).
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = ["pytest>=8"]

[project.scripts]
forecast-mcp = "forecast_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/clean-venv",
    "/timesfm-master",
    "/timesfm.zip",
    "/.pytest_cache",
    "**/__pycache__",
    "**/*.pyc",
    "/.DS_Store",
    "/forecast-mcp.zip",
    "/docs/adr",
]
