site_name: forecast-mcp
site_description: Give any AI agent time-series forecasting superpowers.
site_url: https://ramdhavepreetam.github.io/forecast-mcp/
repo_url: https://github.com/ramdhavepreetam/forecast-mcp
repo_name: ramdhavepreetam/forecast-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Client Setup: client-setup.md
  - Tool Reference: tool-reference.md
  - Cookbook: cookbook.md
  - How It Works: how-it-works.md
  - Limitations: limitations.md
  - Self-Hosting: self-hosting.md
  - Launch Announcement: launch.md
  - Architecture Decisions:
    - ADR 0001 – Architecture & Scope: adr/0001-architecture-and-scope.md
    - ADR 0002 – Phase 1 Verification: adr/0002-phase1-verification.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ramdhavepreetam/forecast-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/forecast-mcp/
